spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lab2db}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: lab2
        format_sql: true
